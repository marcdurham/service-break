services:
  db:
    image: postgres:16-alpine
    container_name: service-break-db
    environment:
      POSTGRES_USER: service_break
      POSTGRES_PASSWORD: service_break_dev
      POSTGRES_DB: service_break
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service_break -d service_break"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
