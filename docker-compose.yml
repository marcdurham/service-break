services:
  db:
    image: postgres:16-alpine
    container_name: service-break-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-service_break}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-service_break_dev}
      POSTGRES_DB: ${POSTGRES_DB:-service_break}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service_break -d service_break"]
      interval: 5s
      timeout: 3s
      retries: 10

  # backend + frontend are profile-gated so the dev workflow
  # (`docker compose up -d` for Postgres only, cargo/trunk run natively)
  # keeps working. Full containerized stack:
  #   docker compose --profile app up --build
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: service-break-backend
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-service_break}:${POSTGRES_PASSWORD:-service_break_dev}@db:5432/${POSTGRES_DB:-service_break}
      BIND_ADDR: 0.0.0.0:8081
      # "Sign in with Google": all three must be set to enable it, otherwise
      # it stays hidden/disabled. See DEPLOY.md for how to get these values.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: service-break-frontend
    profiles: ["app"]
    ports:
      - "127.0.0.1:8020:80"
    depends_on:
      - backend

volumes:
  db-data:
