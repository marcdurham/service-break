services:
  db:
    image: postgres:16-alpine
    container_name: service-break-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-service_break}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-service_break_dev}
      POSTGRES_DB: ${POSTGRES_DB:-service_break}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service_break -d service_break"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Log aggregation (see https://openobserve.ai/). Not profile-gated, like
  # `db`, so it's available whether the backend runs in a container or
  # natively via `cargo run` — set OPENOBSERVE_URL to http://127.0.0.1:5080
  # for the latter. Ships are a no-op if the backend has no OPENOBSERVE_URL.
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: service-break-openobserve
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_USER:-admin@example.com}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_PASSWORD:-Ch4nge-Me-Please!}
    ports:
      - "127.0.0.1:5080:5080"
    volumes:
      - openobserve-data:/data

  # backend + frontend are profile-gated so the dev workflow
  # (`docker compose up -d` for Postgres only, cargo/trunk run natively)
  # keeps working. Full containerized stack:
  #   docker compose --profile app up --build
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: service-break-backend
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-service_break}:${POSTGRES_PASSWORD:-service_break_dev}@db:5432/${POSTGRES_DB:-service_break}
      BIND_ADDR: 0.0.0.0:8081
      # "Sign in with Google": all three must be set to enable it, otherwise
      # it stays hidden/disabled. See DEPLOY.md for how to get these values.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # Disk LRU cache of proxied OSM map tiles (see backend/src/tile_cache.rs).
      TILE_CACHE_DIR: /var/cache/service-break/tiles
      TILE_CACHE_MAX_MB: ${TILE_CACHE_MAX_MB:-512}
      # Ships structured logs to the `openobserve` container above. See
      # DEPLOY.md for the ingestion details.
      OPENOBSERVE_URL: ${OPENOBSERVE_URL:-http://openobserve:5080}
      OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-default}
      OPENOBSERVE_STREAM: ${OPENOBSERVE_STREAM:-backend}
      OPENOBSERVE_USER: ${OPENOBSERVE_USER:-admin@example.com}
      OPENOBSERVE_PASSWORD: ${OPENOBSERVE_PASSWORD:-Ch4nge-Me-Please!}
    volumes:
      - tile-cache:/var/cache/service-break/tiles
    depends_on:
      db:
        condition: service_healthy
      openobserve:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: service-break-frontend
    profiles: ["app"]
    ports:
      - "127.0.0.1:8020:80"
    depends_on:
      - backend

volumes:
  db-data:
  tile-cache:
  openobserve-data:
